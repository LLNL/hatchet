name: unit tests to collect code coverage

on:
  workflow_call:
    secrets:
      HATCHET_CODECOV_TOKEN:
        required: true
 

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # TODO: add macos-latest
        os: [ubuntu-22.04]
        # TODO: add pypy2, pypy3
#        python-version: [3.7, 3.8, 3.9, "3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python Dependencies for 3.12 and later
      if: ${{ matrix.python-version >= '3.12' }}
      run: |
        python -m pip install --upgrade pip pytest setuptools wheel
        pip install -r requirements.txt
        # Optional Dependency for HDF Checkpointing
        pip install tables
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Standard Install Python3 Dependencies
      run: |
        python -m pip install --upgrade pip pytest
        pip install -r requirements.txt
        # Optional Dependency for HDF Checkpointing
        pip install tables
        python setup.py install
        python setup.py build_ext --inplace
        python -m pip list

    - name: Install coverage tools
      run: |
        pip install codecov
        pip install pytest-cov

    - name: Clone Caliper
      uses: actions/checkout@v4
      with:
        repository: LLNL/Caliper
        path: Caliper
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Caliper
      working-directory: Caliper
      run: |
        echo -e "PWD: $(pwd)"
        mkdir build && mkdir install
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=../install ../
        make VERBOSE=1
        make install
        export PATH=$(pwd)/../install/bin:${PATH}
        echo -e "PATH=${PATH}"
        cd $GITHUB_WORKSPACE
        echo -e "PWD:${PWD}"
        which cali-query

    - name: Test Caliper and Timemory Support with pytest
      run: |
        PYTHONPATH=. $(which pytest) --cov=./ --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.HATCHET_CODECOV_TOKEN }}
        directory: ./coverage/reports
        env_vars: OS,PYTHON
        files: /home/runner/work/hatchet/hatchet/coverage.xml
        flags: unittests
        verbose: true
        fail_ci_if_error: true
